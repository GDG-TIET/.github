<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60" font-family="ConsolasFallback,Consolas,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace" role="img" aria-label="Section 05: CORE TEAM">
<style>
@font-face{src:local('Consolas'),local('Consolas Bold');font-family:'ConsolasFallback';font-display:swap;size-adjust:109%}
text,tspan{white-space:pre}
.fx{transform-box:fill-box;transform-origin:0 50%}
.in{opacity:0;animation:in .4s ease-out both}
.bar{transform:scaleX(0);animation:grow .45s ease-out both}
.frame{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:draw .9s ease-out both,fill .5s ease-out both}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out both}
.pop{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.mv{opacity:0;animation:mv .55s cubic-bezier(.2,.9,.3,1) both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .5s ease-out both}
.roll{animation:roll 1.5s cubic-bezier(.2,.75,.25,1) both}
.fr{opacity:0;animation:fr 0.05s step-end}
.fl,.cur{opacity:0;animation:in .01s both}
.blink{animation:blink 1.1s step-end infinite}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes out{to{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes mv{from{opacity:0;transform:translate(var(--mx,0px),var(--my,0px))}to{opacity:1;transform:none}}
@keyframes gy{from{transform:scaleY(0)}to{transform:none}}
@keyframes roll{to{transform:translateY(var(--to))}}
@keyframes fr{0%,100%{opacity:1}}
@keyframes blink{50%{opacity:0}}
.hop{opacity:0;animation:mv .55s cubic-bezier(.3,1.9,.5,1) both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out 1.03s forwards}
.glint{opacity:0;animation:glint 7s ease-in-out 1.48s infinite}
@keyframes glint{0%{opacity:0;transform:none}2%{opacity:1}12%{opacity:1}14%,100%{opacity:0;transform:translateX(504px)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.px,.fl,.cur,.pop,.mv,.hop,.s2,.ag,.sbar{opacity:1}
.bar,.gy,.pop,.mv,.hop,.px,.sbar{transform:none}
.frame{stroke-dashoffset:0;fill-opacity:1}
.draw,.dr{stroke-dashoffset:0}
.roll{transform:translateY(var(--to))}
.beam,.tbeam,.vbeam,.glint,.s1,.fr,.idle,.sweep,.gr,.gb,.shine{display:none}
}
</style>
<defs>
<clipPath id="typ"><rect x="102.0" y="8.0" width="0" height="44"><animate attributeName="width" values="0.0;16.2;32.4;48.6;64.8;81.0;97.2;113.4;129.6;169.8" keyTimes="0.0000;0.1111;0.2222;0.3333;0.4444;0.5556;0.6667;0.7778;0.8889;1.0000" calcMode="discrete" begin="0.400s" dur="0.630s" fill="freeze"/></rect></clipPath>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4285F4" stop-opacity="0"/><stop offset=".5" stop-color="#4285F4"/><stop offset="1" stop-color="#4285F4" stop-opacity="0"/></linearGradient>
</defs>
<circle class="hop" cx="6" cy="30" r="4.5" fill="#4285F4" style="animation-delay:0.050s;--my:-12px"/><circle class="hop" cx="19" cy="30" r="4.5" fill="#EA4335" style="animation-delay:0.130s;--my:-12px"/><circle class="hop" cx="32" cy="30" r="4.5" fill="#FBBC04" style="animation-delay:0.210s;--my:-12px"/><circle class="hop" cx="45" cy="30" r="4.5" fill="#34A853" style="animation-delay:0.290s;--my:-12px"/>
<text class="in" x="62" y="35" font-size="13" font-weight="bold" fill="#8ab4f8" style="animation-delay:0.300s">05<tspan fill="#80868b" font-weight="normal"> /</tspan></text>
<text x="104" y="39" font-size="22" font-weight="bold" letter-spacing="3" fill="#e8eaed" clip-path="url(#typ)">CORE TEAM</text>
<rect x="106.0" y="17.0" width="11.0" height="26" fill="#4285F4" opacity="0"><animate attributeName="x" values="106.0;122.2;138.4;154.6;170.8;187.0;203.2;219.4;235.6;251.8" keyTimes="0.0000;0.1111;0.2222;0.3333;0.4444;0.5556;0.6667;0.7778;0.8889;1.0000" calcMode="discrete" begin="0.400s" dur="0.630s" fill="freeze"/><set attributeName="opacity" to="1" begin="0.400s"/><set attributeName="opacity" to="0" begin="1.530s" fill="freeze"/></rect>
<line class="draw" x1="265.8" y1="30" x2="840.0" y2="30" stroke="#3c4043" stroke-width="1.5" pathLength="1"/>
<rect class="glint" x="265.8" y="28.5" width="70" height="3" rx="1.5" fill="url(#gl)"/>
<text class="in" x="1000" y="35" text-anchor="end" font-size="12" fill="#9aa0a6" style="animation-delay:1.330s">~/gdg-tiet/core-team</text>
</svg>
