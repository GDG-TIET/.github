<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60" font-family="ConsolasFallback,Consolas,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace" role="img" aria-label="Section 04: PROJECTS">
<style>
@font-face{src:local('Consolas'),local('Consolas Bold');font-family:'ConsolasFallback';font-display:swap;size-adjust:109%}
text,tspan{white-space:pre}
.fx{transform-box:fill-box;transform-origin:0 50%}
.in{opacity:0;animation:in .4s ease-out both}
.bar{transform:scaleX(0);animation:grow .45s ease-out both}
.frame{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:draw .9s ease-out both,fill .5s ease-out both}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out both}
.pop{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.mv{opacity:0;animation:mv .55s cubic-bezier(.2,.9,.3,1) both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .5s ease-out both}
.roll{animation:roll 1.5s cubic-bezier(.2,.75,.25,1) both}
.fr{opacity:0;animation:fr 0.05s step-end}
.fl,.cur{opacity:0;animation:in .01s both}
.blink{animation:blink 1.1s step-end infinite}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes out{to{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes mv{from{opacity:0;transform:translate(var(--mx,0px),var(--my,0px))}to{opacity:1;transform:none}}
@keyframes gy{from{transform:scaleY(0)}to{transform:none}}
@keyframes roll{to{transform:translateY(var(--to))}}
@keyframes fr{0%,100%{opacity:1}}
@keyframes blink{50%{opacity:0}}
.tick{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);animation:tick .35s ease-out .05s forwards}
@keyframes tick{to{transform:none}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out 0.81s forwards}
.glint{opacity:0;animation:glint 7s ease-in-out 1.26s infinite}
@keyframes glint{0%{opacity:0;transform:none}2%{opacity:1}12%{opacity:1}14%,100%{opacity:0;transform:translateX(578px)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.px,.fl,.cur,.pop,.mv,.s2,.ag,.stamp,.sbar{opacity:1}
.bar,.tick,.seg,.gy,.pop,.mv,.px,.stamp,.sbar{transform:none}
.frame{stroke-dashoffset:0;fill-opacity:1}
.draw,.dr{stroke-dashoffset:0}
.roll{transform:translateY(var(--to))}
.beam,.tbeam,.vbeam,.glint,.s1,.fr,.idle,.sweep,.gr,.gb,.shine{display:none}
}
</style>
<defs>
<clipPath id="typ"><rect x="52.0" y="8.0" width="0" height="44"><animate attributeName="width" values="0.0;16.2;32.4;48.6;64.8;81.0;97.2;113.4;153.6" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" calcMode="discrete" begin="0.250s" dur="0.560s" fill="freeze"/></rect></clipPath>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34A853" stop-opacity="0"/><stop offset=".5" stop-color="#34A853"/><stop offset="1" stop-color="#34A853" stop-opacity="0"/></linearGradient>
</defs>
<rect class="tick" x="0" y="17" width="4" height="26" rx="2" fill="#34A853"/>
<text class="in" x="14" y="37" font-size="13" font-weight="bold" fill="#188038" style="animation-delay:0.150s">04<tspan fill="#8c959f" font-weight="normal"> /</tspan></text>
<text x="54" y="39" font-size="22" font-weight="bold" letter-spacing="3" fill="#1f2328" clip-path="url(#typ)">PROJECTS</text>
<rect x="56.0" y="17.0" width="11.0" height="26" fill="#34A853" opacity="0"><animate attributeName="x" values="56.0;72.2;88.4;104.6;120.8;137.0;153.2;169.4;185.6" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" calcMode="discrete" begin="0.250s" dur="0.560s" fill="freeze"/><set attributeName="opacity" to="1" begin="0.250s"/><set attributeName="opacity" to="0" begin="1.310s" fill="freeze"/></rect>
<line class="draw" x1="199.6" y1="30" x2="847.2" y2="30" stroke="#d0d7de" stroke-width="1.5" pathLength="1"/>
<rect class="glint" x="199.6" y="28.5" width="70" height="3" rx="1.5" fill="url(#gl)"/>
<text class="in" x="1000" y="35" text-anchor="end" font-size="12" fill="#59636e" style="animation-delay:1.110s">~/gdg-tiet/projects</text>
</svg>
