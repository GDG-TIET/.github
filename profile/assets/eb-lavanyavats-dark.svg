<svg xmlns="http://www.w3.org/2000/svg" width="235" height="252" viewBox="0 0 235 252" font-family="ConsolasFallback,Consolas,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace" role="img" aria-label="Lavanya Vats, GDG-TIET Executive Board">
<style>
@font-face{src:local('Consolas'),local('Consolas Bold');font-family:'ConsolasFallback';font-display:swap;size-adjust:109%}
text,tspan{white-space:pre}
.fx{transform-box:fill-box;transform-origin:0 50%}
.in{opacity:0;animation:in .4s ease-out both}
.bar{transform:scaleX(0);animation:grow .45s ease-out both}
.frame{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:draw .9s ease-out both,fill .5s ease-out both}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out both}
.pop{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.mv{opacity:0;animation:mv .55s cubic-bezier(.2,.9,.3,1) both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .5s ease-out both}
.roll{animation:roll 1.5s cubic-bezier(.2,.75,.25,1) both}
.fr{opacity:0;animation:fr 0.05s step-end}
.fl,.cur{opacity:0;animation:in .01s both}
.blink{animation:blink 1.1s step-end infinite}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes out{to{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes mv{from{opacity:0;transform:translate(var(--mx,0px),var(--my,0px))}to{opacity:1;transform:none}}
@keyframes gy{from{transform:scaleY(0)}to{transform:none}}
@keyframes roll{to{transform:translateY(var(--to))}}
@keyframes fr{0%,100%{opacity:1}}
@keyframes blink{50%{opacity:0}}
.tbeam{opacity:0;animation:tsweep 1s ease-in-out both}
@keyframes tsweep{0%{opacity:0;transform:none}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(312px)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.in,.px,.fl,.cur,.pop,.mv,.hop,.s2,.ag,.sbar{opacity:1}
.bar,.gy,.pop,.mv,.hop,.px,.sbar{transform:none}
.frame{stroke-dashoffset:0;fill-opacity:1}
.draw,.dr{stroke-dashoffset:0}
.roll{transform:translateY(var(--to))}
.beam,.tbeam,.vbeam,.glint,.s1,.fr,.idle,.sweep,.gr,.gb,.shine{display:none}
}
</style>
<defs>
<clipPath id="card"><rect x=".5" y=".5" width="234" height="251" rx="14"/></clipPath>
<clipPath id="av"><circle cx="117.5" cy="102" r="40"/></clipPath>
<linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBBC04" stop-opacity="0"/><stop offset="1" stop-color="#FBBC04" stop-opacity=".25"/></linearGradient>
</defs>
<rect class="frame" x="0.5" y="0.5" width="234.0" height="251.0" rx="14" fill="#292a2d" stroke="#3c4043" pathLength="1" style="animation-delay:0.430s,0.730s"/>

<g clip-path="url(#card)"><rect class="bar fx" x="0.0" width="58.8" height="3" fill="#4285F4" style="animation-delay:0.050s"/><rect class="bar fx" x="58.8" width="58.8" height="3" fill="#EA4335" style="animation-delay:0.170s"/><rect class="bar fx" x="117.5" width="58.8" height="3" fill="#FBBC04" style="animation-delay:0.290s"/><rect class="bar fx" x="176.2" width="58.8" height="3" fill="#34A853" style="animation-delay:0.410s"/><g class="tbeam" style="animation-delay:0.780s"><rect y="-60" width="235" height="60" fill="url(#tb)"/><rect y="-2" width="235" height="2" fill="#FBBC04" fill-opacity=".6"/></g></g>
<g class="in" style="animation-delay:0.730s"><rect x="97.5" y="12" width="40" height="8" rx="4" fill="#202124" stroke="#3c4043"/><text x="117.5" y="40" text-anchor="middle" font-size="10" font-weight="bold" letter-spacing="3" fill="#9aa0a6">EXECUTIVE BOARD</text></g>
<circle cx="117.5" cy="102" r="40" fill="#303134"/>
<image class="in" href="data:image/png;base64," x="77.5" y="62" width="80" height="80" clip-path="url(#av)" style="animation-delay:0.930s"/>
<path class="dr" d="M123.1,56.3A46,46 0 0 1 163.2,96.4" fill="none" stroke="#4285F4" stroke-width="3.5" stroke-linecap="round" pathLength="1" style="animation-delay:0.780s"/>
<path class="dr" d="M163.2,107.6A46,46 0 0 1 123.1,147.7" fill="none" stroke="#EA4335" stroke-width="3.5" stroke-linecap="round" pathLength="1" style="animation-delay:0.900s"/>
<path class="dr" d="M111.9,147.7A46,46 0 0 1 71.8,107.6" fill="none" stroke="#FBBC04" stroke-width="3.5" stroke-linecap="round" pathLength="1" style="animation-delay:1.020s"/>
<path class="dr" d="M71.8,96.4A46,46 0 0 1 111.9,56.3" fill="none" stroke="#34A853" stroke-width="3.5" stroke-linecap="round" pathLength="1" style="animation-delay:1.140s"/>
<text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.130s">2EY+PI/ &gt;C15</text><text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.180s">LD7&amp;2SL O3LA</text><text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.230s">LAV1SN% 7MV#</text><text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.280s">LAVA6TA J&gt;C6</text><text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.330s">LAVANI&gt; AF6H</text><text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.380s">LAVANYA 1&gt;V5</text><text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.430s">LAVANYA MIU6</text><text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.480s">LAVANYA VG=3</text><text class="fr" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.530s">LAVANYA VAT$</text><text class="fl" x="117.5" y="176" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#e8eaed" style="animation-delay:1.580s">LAVANYA VATS</text>

<text class="in" x="117.5" y="196" text-anchor="middle" font-size="11" fill="#fdd663" style="animation-delay:1.330s">@LavanyaVats ↗</text>
<g class="pop" style="animation-delay:1.480s"><rect x="65.5" y="212" width="104" height="20" rx="10" fill="#fdd663"/><text x="117.5" y="226" text-anchor="middle" font-size="10" font-weight="bold" letter-spacing="1.5" fill="#202124">ALL ACCESS</text></g>
</svg>
